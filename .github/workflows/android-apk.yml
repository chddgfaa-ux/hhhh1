name: Build Prime Voice APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files (including nested ZIP)
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          OUTER_ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './extracted/*' | head -n 1)"
          if [ -z "$OUTER_ZIP" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi
          echo "Outer ZIP: $OUTER_ZIP"
          unzip -oq "$OUTER_ZIP" -d extracted

          for level in 1 2 3 4; do
            mapfile -t ZIPS < <(find extracted -type f -iname '*.zip' | sort)
            if [ "${#ZIPS[@]}" -eq 0 ]; then
              break
            fi
            for z in "${ZIPS[@]}"; do
              dest="${z%.zip}_contents"
              mkdir -p "$dest"
              echo "Extracting nested archive: $z"
              unzip -oq "$z" -d "$dest"
            done
          done

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e
          SETTINGS_FILE="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle(.kts) found after extracting ZIP archives."
            find extracted -maxdepth 7 -type f | head -n 200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in preinstalled Android SDK."
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Voice-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
